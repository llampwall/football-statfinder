[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-statfinder"
version = "2.0.0a0"
description = "Weekly NFL/CFB betting data-pack pipeline (season-2 rebuild)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "requests>=2.31,<3",
    "lxml>=4.9",
    "html5lib>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
statfinder = "football_statfinder.cli:main"

[tool.setuptools.packages.find]
include = ["football_statfinder*"]
